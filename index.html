<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda do barbeiro | Barbearia Britos</title>
<meta name="description" content="Painel interno da Barbearia Britos para consultar os agendamentos do dia.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0d0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/emblema-branco.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Britos">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/agenda.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Britos, agenda do dia"><img src="img/emblema-branco.png" alt="" width="31" height="34"><span>Britos</span></a>
    <nav class="links" aria-label="Páginas do painel">
      <a class="link" href="index.html" aria-current="page">Agenda<span class="longo"> do dia</span></a>
      <a class="link" href="calendario.html">Calendário</a>
      <a class="link" href="folgas.html">Folgas</a>
    </nav>
  </div>
</header>
<div class="tri" aria-hidden="true"></div>
<noscript><p class="sem-js">Este painel precisa do JavaScript ativado no navegador para mostrar os agendamentos.</p></noscript>
<main>
<div class="wrap">
  <span class="eyebrow">Painel do barbeiro</span>
  <h1>Agenda do dia</h1>
  <div class="nav">
    <button class="chip" id="prev" type="button" aria-label="Dia anterior">Anterior</button>
    <button class="chip" id="hoje" type="button">Hoje</button>
    <button class="chip" id="next" type="button" aria-label="Próximo dia">Próximo</button>
    <h2 id="titulo" aria-live="polite"></h2>
  </div>
  <p class="aviso" id="aviso" hidden></p>
  <div class="week" id="week" role="group" aria-label="Dias da semana"></div>

  <div class="stats" role="group" aria-label="Resumo do dia">
    <div class="stat"><p>Agendamentos</p><strong id="s-qtd">0</strong><small id="s-livres"></small></div>
    <div class="stat"><p>Receita prevista</p><strong id="s-rec">R$ 0</strong></div>
    <div class="stat"><p id="s-prox-rotulo">Próximo cliente</p><strong id="s-prox">Nenhum</strong><small id="s-prox2"></small></div>
  </div>

  <div class="filters" role="group" aria-label="Filtrar horários">
    <button class="chip" type="button" data-f="todos" aria-pressed="true">Todos</button>
    <button class="chip" type="button" data-f="ocupados" aria-pressed="false">Marcados</button>
    <button class="chip" type="button" data-f="livres" aria-pressed="false">Livres</button>
    <a class="chip ver" id="marcar-folga" href="folgas.html">Marcar folga</a>
  </div>
  <ul id="lista"></ul>
</div>
</main>

<script src="js/script.js" defer></script>
<script src="js/agenda.js" defer></script>
</body>
</html>
